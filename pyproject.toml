# pyproject.toml
[tool.black]
line-length = 100
target-version = ["py311"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.venv
  | venv
  | mlruns
  | infra/great_expectations
)/
'''

[tool.isort]
profile = "black"
line_length = 100
skip = ["mlruns", "infra/great_expectations"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["mlruns", "infra/great_expectations", ".venv", "venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B"]
ignore = ["E501"]  # line length handled by black

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
no_strict_optional = true
exclude = ["mlruns", "infra/great_expectations", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: requires live Postgres/MLflow infrastructure",
]
