# config/config.yaml
# Central configuration for the Loan Default Prediction Pipeline

database:
  host: ${DB_HOST:-localhost}
  port: ${DB_PORT:-5432}
  name: ${DB_NAME:-loan_default}
  user: ${DB_USER:-mlops}
  password: ${DB_PASSWORD:-mlops_secret}
  pool_size: 10
  max_overflow: 20
  schema: loan_data

mlflow:
  tracking_uri: ${MLFLOW_TRACKING_URI:-http://localhost:5000}
  experiment_name: loan_default_prediction
  model_name: loan_default_xgboost
  artifact_root: ${MLFLOW_ARTIFACT_ROOT:-/mlflow/artifacts}

airflow:
  schedule_interval: "@weekly"           # Regular retraining cadence
  monitoring_interval: "0 */6 * * *"    # Drift check every 6 hours
  catchup: false
  max_active_runs: 1
  retries: 2
  retry_delay_minutes: 5

model:
  # XGBoost hyperparameters
  xgboost:
    n_estimators: 500
    max_depth: 6
    learning_rate: 0.05
    subsample: 0.8
    colsample_bytree: 0.8
    scale_pos_weight: 11     # ~11:1 class imbalance in Home Credit
    eval_metric: auc
    use_label_encoder: false
    random_state: 42
    early_stopping_rounds: 50
    n_jobs: -1

  # Validation thresholds for production promotion
  validation:
    min_auc_roc: 0.75
    min_precision: 0.60
    min_recall: 0.55
    min_f1: 0.60
    max_brier_score: 0.15

  # Feature engineering
  features:
    numerical_impute_strategy: median
    categorical_impute_strategy: most_frequent
    max_cardinality: 50          # Drop categoricals with > 50 unique values
    variance_threshold: 0.01     # Drop near-zero variance features
    correlation_threshold: 0.95  # Drop highly correlated features

monitoring:
  # Evidently drift thresholds
  psi_warning: 0.10
  psi_critical: 0.20            # Triggers automatic retraining
  js_divergence_warning: 0.05
  js_divergence_critical: 0.10
  auc_degradation_warning: 0.02
  auc_degradation_critical: 0.05
  min_samples_for_drift: 500
  reference_window_days: 90     # Days of data used as drift reference
  production_window_days: 7     # Days of production data to evaluate

serving:
  host: 0.0.0.0
  port: 8000
  workers: 4
  timeout: 30
  model_cache_ttl_seconds: 300  # Reload model every 5 minutes
  log_predictions: true
  prediction_log_table: prediction_log

great_expectations:
  context_root: infra/great_expectations
  datasource_name: loan_data_pg
  suite_name: loan_features_suite
  checkpoint_name: loan_data_checkpoint

data:
  raw_table: raw_applications
  features_table: engineered_features
  predictions_table: prediction_log
  train_split: 0.70
  val_split: 0.15
  test_split: 0.15
  min_training_rows: 10000
