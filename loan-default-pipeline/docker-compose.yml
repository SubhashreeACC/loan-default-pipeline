# docker-compose.yml
# Full Loan Default Prediction Pipeline stack

version: "3.9"

x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: docker/Dockerfile.airflow
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${DB_USER:-mlops}:${DB_PASSWORD:-mlops_secret}@postgres/${DB_NAME:-loan_default}
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:-46BKJoQYlPPOexq0OhDZnIlNepKFf87WFwLt0nfd3FE=}
    AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY:-secret}
    AIRFLOW__CORE__PARALLELISM: 4
    AIRFLOW__SCHEDULER__DAG_DIR_LIST_INTERVAL: 30
    MLFLOW_TRACKING_URI: http://mlflow:5000
    DB_HOST: postgres
    DB_PORT: 5432
    DB_NAME: ${DB_NAME:-loan_default}
    DB_USER: ${DB_USER:-mlops}
    DB_PASSWORD: ${DB_PASSWORD:-mlops_secret}
    API_BASE_URL: http://api:8000
    AIRFLOW_USER: admin
    AIRFLOW_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:-admin}
    DATA_INGESTION_DIR: /data/incoming
    REPORT_DIR: /reports
    PYTHONPATH: /opt/airflow
  volumes:
    - ./dags:/opt/airflow/dags
    - ./src:/opt/airflow/src
    - ./config:/opt/airflow/config
    - ./infra:/opt/airflow/infra
    - airflow-logs:/opt/airflow/logs
    - data-incoming:/data/incoming
    - evidently-reports:/reports
  depends_on:
    postgres:
      condition: service_healthy
  networks:
    - mlops-net


services:

  # ─── PostgreSQL ─────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: loan_postgres
    environment:
      POSTGRES_USER: ${DB_USER:-mlops}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-mlops_secret}
      POSTGRES_DB: ${DB_NAME:-loan_default}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/migrations:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-mlops} -d ${DB_NAME:-loan_default}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mlops-net

  # ─── MLflow Tracking Server ──────────────────
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.10.0
    container_name: loan_mlflow
    command: >
      mlflow server
      --backend-store-uri postgresql+psycopg2://${DB_USER:-mlops}:${DB_PASSWORD:-mlops_secret}@postgres/${DB_NAME:-loan_default}
      --default-artifact-root /mlflow/artifacts
      --host 0.0.0.0
      --port 5000
      --serve-artifacts
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
    volumes:
      - mlflow-artifacts:/mlflow/artifacts
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - mlops-net

  # ─── Airflow Webserver ───────────────────────
  airflow-webserver:
    <<: *airflow-common
    container_name: loan_airflow_web
    command: webserver
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  # ─── Airflow Scheduler ───────────────────────
  airflow-scheduler:
    <<: *airflow-common
    container_name: loan_airflow_scheduler
    command: scheduler
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type SchedulerJob --hostname $(hostname)"]
      interval: 30s
      timeout: 10s
      retries: 5

  # ─── Airflow Init (one-shot) ─────────────────
  airflow-init:
    <<: *airflow-common
    container_name: loan_airflow_init
    command: >
      bash -c "
        airflow db upgrade &&
        airflow users create
          --username admin
          --firstname Admin
          --lastname User
          --role Admin
          --email admin@example.com
          --password ${AIRFLOW_ADMIN_PASSWORD:-admin}
      "
    restart: "no"

  # ─── FastAPI Prediction Service ───────────────
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: loan_api
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-loan_default}
      DB_USER: ${DB_USER:-mlops}
      DB_PASSWORD: ${DB_PASSWORD:-mlops_secret}
      PYTHONPATH: /app
    ports:
      - "8000:8000"
    depends_on:
      mlflow:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 20s
      timeout: 5s
      retries: 5
    networks:
      - mlops-net
    restart: unless-stopped

  # ─── Evidently Monitoring Dashboard ──────────
  monitoring-dashboard:
    build:
      context: .
      dockerfile: docker/Dockerfile.monitoring
    container_name: loan_monitoring
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-loan_default}
      DB_USER: ${DB_USER:-mlops}
      DB_PASSWORD: ${DB_PASSWORD:-mlops_secret}
      REPORT_DIR: /reports
      PYTHONPATH: /app
    volumes:
      - evidently-reports:/reports
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - mlops-net
    restart: unless-stopped


# ─────────────────────────────────────────────
volumes:
  postgres-data:
  mlflow-artifacts:
  airflow-logs:
  data-incoming:
  evidently-reports:

networks:
  mlops-net:
    driver: bridge
