# .github/workflows/ci.yml
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.11"

jobs:

  # ─────────────────────────────────────────────
  lint:
    name: Lint & Static Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run ruff (lint)
        run: ruff check src/ tests/ dags/

      - name: Run black (format check)
        run: black --check src/ tests/ dags/

      - name: Run isort (import order check)
        run: isort --check-only src/ tests/ dags/

      - name: Run mypy (type check)
        run: mypy src/ --ignore-missing-imports --no-strict-optional
        continue-on-error: true   # type checks are advisory, don't block merges


  # ─────────────────────────────────────────────
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run unit tests with coverage
        env:
          CONFIG_PATH: config/config.yaml
        run: |
          pytest tests/unit \
            --cov=src \
            --cov-report=xml \
            --cov-report=term-missing \
            --cov-fail-under=40

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: coverage.xml
          fail_ci_if_error: false


  # ─────────────────────────────────────────────
  integration-tests:
  name: Integration Tests
  runs-on: ubuntu-latest
  needs: unit-tests

  services:
    postgres:
      image: postgres:15-alpine
      env:
        POSTGRES_USER: mlops
        POSTGRES_PASSWORD: mlops_secret
        POSTGRES_DB: loan_default
      ports:
        - 5432:5432
      options: >-
        --health-cmd "pg_isready -U mlops"
        --health-interval 10s
        --health-timeout 5s
        --health-retries 5

  steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: pip

    - name: Install dependencies
      run: |
        pip install --upgrade pip
        pip install -r requirements-dev.txt

    - name: Start MLflow server
      run: |
        mkdir -p /tmp/mlflow-artifacts
        nohup mlflow server \
          --host 0.0.0.0 \
          --port 5000 \
          --backend-store-uri sqlite:///mlflow.db \
          --default-artifact-root /tmp/mlflow-artifacts \
          > mlflow.log 2>&1 &

    - name: Wait for MLflow server
      run: |
        for i in {1..30}; do
          if curl -sf http://localhost:5000 >/dev/null; then
            echo "✅ MLflow server is running"
            exit 0
          fi
          echo "Waiting for MLflow..."
          sleep 2
        done

        echo "❌ MLflow failed to start"
        cat mlflow.log || true
        exit 1

    - name: Apply database migrations
      env:
        PGPASSWORD: mlops_secret
      run: |
        psql -h localhost -U mlops -d loan_default \
          -f infra/migrations/001_initial_schema.sql

    - name: Run integration tests
      env:
        DB_HOST: localhost
        DB_PORT: 5432
        DB_NAME: loan_default
        DB_USER: mlops
        DB_PASSWORD: mlops_secret
        MLFLOW_TRACKING_URI: http://localhost:5000
        CONFIG_PATH: config/config.yaml
        RUN_INTEGRATION_TESTS: "1"
      run: |
        pytest tests/integration --integration -v --tb=short